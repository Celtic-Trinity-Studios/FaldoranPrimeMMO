; =====================================================
;  FaldoranPrime World Generation Settings
;  SPHERICAL PLANET: Earth-scale (R=6,371 km, C≈40,075 km)
;  Chunk size: 1.28km at equator, ~31,309 longitude cells
;  Latitude bands: ~15,654 (pole to pole)
;  Vertical range: -11km to +9km (20km total)
;
;  TERRAIN HEIGHTS (centimeters):
;    HeightBase  = -1100000 (11km trench depth)
;    HeightScale =  2000000 (20km total vertical range)
;    Sea Level   =  0.55 normalized
;
;  COORDINATE SYSTEM:
;    Geodetic (Lat, Lon, Alt) for global positions.
;    Local tangent plane (cm) for rendering and physics.
;    Noise sampled on 3D unit sphere — seamless everywhere.
; =====================================================

[WorldGen]
Seed=1234123
; Sea level is at Z=0
WaterZHeight=0.0
MaxChunksPerFrame=3
UpdateInterval=0.25
FullDetailRange=2
MediumDetailRange=5
LowDetailRange=9
bDrawDebugChunks=0

[Terrain]
NoiseScale=6.0
IslandRadiusFraction=0.55
HeightBase=-1100000.0
HeightScale=2000000.0
MaxHeight=1.0
; Meadows sit ~400m above sea level
MeadowFlattenTarget=0.57
MeadowFlattenStrength=0.15
MountainPeakIntensity=0.15

[Rivers]
bEnableRivers=1
RiverBedHeight=0.55
; 0.002 = 4,000cm = 40m shallow river valleys (was 400m canyons)
RiverCarveDepth=0.002
RiverCarveStrength=0.50
RiverMaskThreshold=0.20

[Lakes]
bEnableLakes=1
LakeBedHeight=0.555
LakeThreshold=0.58

; =====================================================
;  FLOWING WATER SYSTEM
; =====================================================

[WaterSources]
SourcesPerMountainChunk=3
SpringFlowRate=150.0
MinSpringElevation=0.75

[WaterSimulation]
bEnableFlowingWater=0
SimulationRate=2
FlowGravity=980.0
MinRenderDepth=5.0
EvaporationRate=0.001
MaxWaterDepth=5000.0
MaxFlowHops=500
[Ocean]
; Trench depth (11km) is now H=0.0
OceanFloorDepth=0.0

; =====================================================
;  CAVE SYSTEM — Solid Voxel Underground
;
;  WORM TUNNELS:
;    Two perpendicular 3D noise channels. Tunnels form where
;    both exceed WormThreshold. Higher threshold = thinner tunnels.
;
;  GRAND CAVERNS:
;    Low-frequency 3D noise creates large open spaces at moderate
;    depth. Higher CavernThreshold = fewer, larger caverns.
;
;  DEPTH ATTENUATION:
;    SurfaceBuffer  = no-cave zone directly below surface (cm)
;    TransitionEnd  = depth where full cave density begins (cm)
;    FullCaveDepth  = depth of peak cavern development (cm)
;    FadeStart      = caves start becoming rarer (cm)
;    FadeEnd        = almost zero caves below this depth (cm)
;
;  All values in centimeters.
; =====================================================

[Caves]
bEnableCaves=1

; Worm tunnel frequencies (1/cm) — wavelength = 1/freq
; Default: ~200m horizontal tunnels, ~125m vertical spacing
WormFreqXY=0.000005
WormFreqZ=0.000008

; Worm threshold (0-1): higher = thinner tunnels
; 0.55 ≈ 15m radius tunnels, 0.50 ≈ 25m, 0.60 ≈ 8m
WormThreshold=0.55

; Cavern frequency (1/cm) — wavelength ~500m features
CavernFreq=0.000002

; Cavern threshold (0-1): higher = fewer, larger caverns
CavernThreshold=0.62

; Depth zones (cm below terrain surface)
SurfaceBuffer=5000.0
TransitionEnd=20000.0
FullCaveDepth=200000.0
FadeStart=300000.0
FadeEnd=500000.0

; =====================================================
;  NEXUS SYSTEM
;  Safe starter hubs — one per continent.
;  Players always spawn here on first login.
;  No creatures or PCG vegetation spawn inside SafeRadius.
;
;  NexusCount        = total number of nexuses
;  NexusSafeRadius   = global default safe radius (cm)
;  Nexus0_Name       = display name
;  Nexus0_WorldX/Y   = center in world-space cm (XY)
;  Nexus0_SafeRadius = per-nexus override (optional)
; =====================================================

[Nexus]
NexusCount=1
NexusSafeRadius=51200.0

; --- Starter Island Nexus (Continent 0) ---
; Placed at world origin (island center) — guaranteed landmass.
; Future: derive XY from seed to find a flat Meadows/Forest area.
Nexus0_Name=Aelvorn Nexus
Nexus0_WorldX=0.0
Nexus0_WorldY=0.0
Nexus0_SafeRadius=51200.0