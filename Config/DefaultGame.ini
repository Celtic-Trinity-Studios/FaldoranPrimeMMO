
[FPM.Server]
; Dedicated server IP address and port for client auto-connect.
; The client will travel to this address on startup.
; In PIE/standalone, set bAutoConnect=false to use listen-server instead.
;
; Override with environment variables: FPM_SERVER_IP, FPM_SERVER_PORT
; Or place values in Config/ServerSecrets.ini (not committed to VCS).
ServerIP=127.0.0.1
ServerPort=7777
bAutoConnect=false

[FPM.Database]
; Database connection details.
; IMPORTANT: Do NOT put real credentials here. This file is committed to VCS.
; Use one of these methods instead:
;   1. Environment variables: FPM_DB_HOST, FPM_DB_PORT, FPM_DB_NAME,
;      FPM_DB_USER, FPM_DB_PASSWORD
;   2. Config/ServerSecrets.ini (gitignored, see ServerSecrets.ini.template)
Host=localhost
Port=5432
DatabaseName=faldoran_prime
Username=fpm_server
Password=
