[/Script/SapientCore.CodeIntelSettings]
; Index directory relative to project Saved/
IndexDirectory=CodeIntelligence/.ts_index

; Auto-build index on project open
bAutoBuildOnStartup=true

; Auto-refresh index on file save
bAutoRefreshOnSave=false

; Debounce delay for auto-refresh (milliseconds)
RefreshDebounceMs=500

; Compaction interval (minutes, 0 to disable)
CompactionIntervalMinutes=15

; Max reindexer queue size
MaxReindexerQueue=1024

; Include generated code in index
bIncludeGeneratedCode=false

; Show detailed indexing progress
bShowDetailedProgress=false

; Log query performance
bLogQueryPerformance=true

; Log file processing (verbose)
bLogFileProcessing=false
